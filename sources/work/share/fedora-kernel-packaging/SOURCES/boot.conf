# Source build VM settings. Image assembly replaces this with the final unique
# root UUID and ROOT_FSTYPE=ext4, ROOT_FLAGS= for the internal-eMMC image.
# The updater verifies these against the mounted root filesystem before writing.
ROOT_UUID=6741cdec-fe58-4214-9fa9-3e8eaa52f476
ROOT_FSTYPE=btrfs
ROOT_FLAGS=subvol=root
EXTRA_ARGS=console=tty0 console=ttyS2,115200n8 rootwait loglevel=4 brcmfmac.feature_disable=0x82000
